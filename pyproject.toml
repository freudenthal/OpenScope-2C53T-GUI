[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openscope-gui"
version = "0.1.0"
description = "Desktop instrument window for the OpenScope 2C53T (PySide6 + pyqtgraph)"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
# `openscope` is the host library in the firmware repository
# (OpenScope-2C53T/tools/openscope_host). It is not on PyPI: install it first,
# editable, from your firmware checkout. See README.md.
dependencies = ["openscope>=0.1.0", "PySide6-Essentials", "pyqtgraph>=0.14", "numpy"]

[project.scripts]
openscope-gui = "openscope_gui.app:main"

[tool.setuptools]
packages = ["openscope_gui"]
