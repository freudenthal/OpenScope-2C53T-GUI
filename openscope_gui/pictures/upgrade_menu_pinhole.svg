<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="320" height="300">
  <!-- Schematic drawing (not to scale): way 2 into upgrade mode (corrections C-20).
       Hold MENU, press the pinhole reset with a pin, keep MENU held 3 to 5 s. -->
  <rect x="0" y="0" width="320" height="300" fill="#ffffff"/>
  <rect x="40" y="20" width="240" height="240" rx="18" fill="#3a3a3a" stroke="#111" stroke-width="3"/>
  <rect x="62" y="38" width="196" height="110" rx="4" fill="#1f4e79" stroke="#0b2236" stroke-width="2"/>
  <text x="160" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#dfe9f3" text-anchor="middle">screen</text>
  <g fill="#6b6b6b" stroke="#222" stroke-width="1.5">
    <rect x="62" y="166" width="36" height="20" rx="4"/>
    <rect x="142" y="166" width="36" height="20" rx="4"/>
    <rect x="182" y="166" width="36" height="20" rx="4"/>
    <rect x="62" y="196" width="36" height="20" rx="4"/>
    <rect x="102" y="196" width="36" height="20" rx="4"/>
    <rect x="142" y="196" width="36" height="20" rx="4"/>
    <rect x="182" y="196" width="36" height="20" rx="4"/>
    <rect x="62" y="226" width="36" height="20" rx="4"/>
    <rect x="102" y="226" width="36" height="20" rx="4"/>
    <rect x="142" y="226" width="36" height="20" rx="4"/>
  </g>
  <circle cx="246" cy="206" r="16" fill="#6b6b6b" stroke="#222" stroke-width="1.5"/>
  <!-- MENU: hold (orange) -->
  <rect x="102" y="166" width="36" height="20" rx="4" fill="#f2994a" stroke="#7a3d00" stroke-width="2.5"/>
  <text x="120" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">MENU</text>
  <!-- pinhole reset with a pin (red) -->
  <circle cx="268" cy="150" r="4" fill="#000" stroke="#eb5757" stroke-width="3"/>
  <line x1="300" y1="118" x2="272" y2="146" stroke="#b30000" stroke-width="3"/>
  <text x="284" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#b30000">pin</text>
  <rect x="150" y="260" width="20" height="14" fill="#555"/>
  <path d="M160 274 C160 288 200 290 230 292" stroke="#555" stroke-width="5" fill="none"/>
  <text x="238" y="296" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#333">USB</text>
  <text x="10" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#b35900">1 hold</text>
  <text x="224" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#b30000">2</text>
  <text x="160" y="14" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#222" text-anchor="middle">If not: hold MENU, press reset, hold 3-5 s</text>
</svg>
